# Inference (beam search) configuration. Plan section 32.

generation:
  num_beams: 5
  length_penalty: 1.0
  max_new_tokens: 128
  no_repeat_ngram_size: 0
  early_stopping: true

# For semantic reranking we generate top-N hypotheses per source.
topk:
  num_return_sequences: 5
  output_scores: true
  return_dict_in_generate: true

batch:
  per_device_batch_size: 8
